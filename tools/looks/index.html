<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mood — rendus à comparer</title>
<!-- Page de travail (pas un écran du site) : compare les trois rendus des photos, palier par palier.
     Ouvrir en local : python3 -m http.server 8000 puis http://localhost:8000/tools/looks/
     Images d'essai générées dans la page (aucune vraie image) ; « Ta photo » reste sur l'appareil, rien n'est envoyé. -->
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #555; --rule: #d9d9d9; --panel: #fafafa;
    --font: 'IBM Plex Sans JP', 'Hiragino Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 200 13px/1.6 var(--font); padding: 20px clamp(16px, 4vw, 40px) 60px; }
  h1 { font-weight: 100; font-size: 1.4rem; letter-spacing: .3em; margin: 0 0 4px; }
  .lead { margin: 0 0 18px; color: var(--muted); max-width: 60em; }
  .controls { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center;
    padding: 10px 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  legend { float: left; margin-right: 8px; font: 200 12px var(--mono); color: var(--muted); }
  label.chip { position: relative; cursor: pointer; }
  label.chip input { position: absolute; opacity: 0; }
  label.chip span { display: inline-block; padding: 7px 10px; border: 1px solid var(--rule); font: 200 12px var(--mono); transition: background .14s, color .14s, border-color .14s; }
  label.chip input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  label.chip input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
  .file { font: 200 12px var(--mono); }
  .heads, .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .heads { margin-bottom: 10px; }
  .heads h2 { margin: 0; font-weight: 200; font-size: 1rem; letter-spacing: .06em; }
  .heads p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .row { margin-bottom: 22px; }
  .cell { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
  .cell img { position: absolute; display: block; max-width: none; }
  .cell .main { inset: 6% 6% auto auto; width: 78%; }
  .cell .under { left: 0; bottom: 0; width: 60%; display: none; }
  body[data-bg="checker"] .cell { background: repeating-conic-gradient(#e6e6e6 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  body[data-bg="stack"] .cell .under { display: block; }
  .scene-name { grid-column: 1 / -1; margin: 0 0 -8px; font: 200 11px var(--mono); color: var(--muted); }
  @media (max-width: 639px) {
    .heads, .row { grid-template-columns: 1fr; }
    .heads { display: none; }
    .cell::before { content: attr(data-label); position: absolute; left: 0; top: 0; z-index: 1; font: 200 11px var(--mono); color: var(--muted); background: var(--bg); padding: 2px 6px; }
  }
</style>
</head>
<body data-bg="white">
<h1>Mood</h1>
<p class="lead">Trois rendus des photos, côte à côte. Le site publié garde « Actuel » tant qu'aucun autre n'est choisi.
  Sur le vrai mur : ajouter <code>?look=soft</code> ou <code>?look=copy</code> à l'adresse du site (aperçu local, rien n'est enregistré).</p>

<div class="controls">
  <fieldset id="stage"><legend>Âge</legend></fieldset>
  <fieldset id="bg"><legend>Fond</legend></fieldset>
  <label class="file">Ta photo (reste sur l'appareil) : <input type="file" id="mine" accept="image/*"></label>
</div>

<div class="heads" id="heads"></div>
<div id="rows"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" id="filters"></svg>
<script type="module" src="looks-page.js"></script>
</body>
</html>
