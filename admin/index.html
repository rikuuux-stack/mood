<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mood — admin</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="stylesheet" href="../css/fonts.css?v=af3ebca491">
<link rel="stylesheet" href="../css/site.css?v=734132e0ae">
<link rel="stylesheet" href="admin.css?v=41e42d78b2">
</head>
<body>
<header class="bar">
  <a class="id" href="../"><span class="id-name">Mood</span></a>
  <button type="button" class="link" id="logout" hidden>Log out</button>
</header>

<main class="adm">
  <!-- Connexion -->
  <form id="login" class="adm-login" hidden>
    <h1>Admin</h1>
    <input type="email" id="email" autocomplete="username" value="rikuuux@gmail.com" aria-label="E-mail">
    <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button type="submit" class="btn-drop btn-drop--wide">Log in</button>
    <p class="form-msg" id="loginMsg" role="status"></p>
  </form>

  <!-- Tableau de bord -->
  <section id="dash" hidden>
    <nav class="adm-tabs" role="tablist">
      <button type="button" role="tab" data-tab="pending" aria-selected="true">Pending <span data-n="pending"></span></button>
      <button type="button" role="tab" data-tab="hidden" aria-selected="false">Reported <span data-n="hidden"></span></button>
      <button type="button" role="tab" data-tab="published" aria-selected="false">Live <span data-n="published"></span></button>
      <button type="button" role="tab" data-tab="mine" aria-selected="false">Drop</button>
    </nav>
    <p class="form-msg" id="dashMsg" role="status"></p>
    <p class="adm-storage" id="storage"></p>
    <ol id="cards" class="adm-cards"></ol>

    <!-- Dépôt direct de l'auteur du site : publié tout de suite, avec la marque -->
    <form id="mine" class="drop-form adm-mine" hidden>
      <div class="file-row">
        <label class="file"><input type="file" id="mineFile" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,.mov,.mp4"><span class="btn" id="mineFileLabel">Image / video</span></label>
        <button type="button" class="link" id="mineRemove" hidden>Remove</button>
      </div>
      <figure class="preview" id="minePreview" hidden><canvas aria-hidden="true"></canvas><span class="adm-video" id="mineVideo" hidden></span><figcaption id="mineInfo"></figcaption></figure>
      <label class="slider" id="mineStartRow" hidden><span>Start</span><input type="range" id="mineStart" min="0" max="0" step="0.1" value="0"><output id="mineStartOut" for="mineStart">0 s</output></label>
      <label class="slider grain" id="mineGrainRow" hidden><span>Grain</span><input type="range" id="mineGrain" min="0" max="100" step="1" value="0"><output id="mineGrainOut" for="mineGrain">0</output></label>
      <textarea id="mineText" rows="4" placeholder="Words" aria-label="Words"></textarea>
      <p class="hint count"><span id="mineCount"></span></p>
      <fieldset class="sizes"><legend>Size</legend>
        <label><input type="radio" name="size" value="s"><span>S</span></label>
        <label><input type="radio" name="size" value="m" checked><span>M</span></label>
        <label><input type="radio" name="size" value="l"><span>L</span></label>
      </fieldset>
      <button type="submit" class="btn-drop btn-drop--wide">Drop</button>
      <p class="form-msg" id="mineMsg" role="status"></p>
    </form>
  </section>
</main>

<script type="module" src="admin.js?v=dd1dd1744e"></script>
</body>
</html>
