# Vérifications automatiques à chaque envoi et pull request :
#  - les empreintes de cache (?v=…) sont à jour (sinon des visiteurs garderaient d'anciens fichiers) ;
#  - les règles de lisibilité du mur sont respectées ;
#  - dans un vrai navigateur (iPhone émulé, données factices) : Mood / Drop, fond fixe, érosion, images, vidéos ;
#  - conversion des vidéos et GIF (Google Chrome, qui encode le H.264).
name: Vérifications
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Empreintes de cache à jour
        run: python3 tools/stamp.py --check
      - name: Règles du mur
        run: node tests/wall.test.mjs
      - name: Contrôles serveur (formats, métadonnées, budget)
        run: node tests/server.test.mjs
      - name: Navigateur (bandeau, fond, érosion)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser.test.mjs
        env:
          PW_CHANNEL: chrome          # Google Chrome du runner GitHub : lit le H.264 (lecture réelle des vidéos)
      - name: Conversion vidéo et GIF (Google Chrome, H.264 ; poids réels sur 60 s)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          node tests/video.test.mjs
        env:
          PW_CHANNEL: chrome
