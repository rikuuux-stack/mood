# Branche jetable claude/verif-count : VÉRIFIE (lecture seule) que chaque fichier pointé par la base — ceux que /admin/
# affiche — est bien un négatif (même contrôle que le serveur). N'affiche aucun contenu, n'écrit rien.
name: Vérifications
on:
  push:
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ovvdtthnykqvgarrjina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Fichiers pointés par la base (ceux que voit /admin/) — négatifs ?
        run: |
          key=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key' | head -n 1)
          echo "::add-mask::$key"
          SERVICE_KEY="$key" SUPABASE_URL="https://$REF.supabase.co" node verif.mjs
