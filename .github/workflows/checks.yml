# Vérifications automatiques à chaque envoi et pull request :
#  - les empreintes de cache (?v=…) sont à jour (sinon des visiteurs garderaient d'anciens fichiers) ;
#  - les règles de lisibilité du mur sont respectées ;
#  - dans un vrai navigateur (iPhone émulé, données factices) : bandeau, fond fixe, érosion.
name: Vérifications
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Empreintes de cache à jour
        run: python3 tools/stamp.py --check
      - name: Règles du mur
        run: node tests/wall.test.mjs
      - name: Contrôles serveur (formats, métadonnées, budget)
        run: node tests/server.test.mjs
      - name: Navigateur (bandeau, fond, érosion)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser.test.mjs
