# Branche jetable claude/verif-prod : vérifie que le site EN LIGNE (moodwall.pages.dev) sert la version de main.
name: Vérifications
on:
  push:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Le site en ligne sert-il main ?
        run: |
          set -u
          for i in $(seq 1 12); do
            live=$(curl -sS --max-time 20 https://moodwall.pages.dev/)
            a=$(grep -o '[a-z/.]*\.\(css\|js\)?v=[0-9a-f]*' <<<"$live" | sort -u)
            b=$(grep -o '[a-z/.]*\.\(css\|js\)?v=[0-9a-f]*' index.html | sort -u)
            echo "--- empreintes en ligne :"; echo "$a"
            if [ "$a" = "$b" ]; then echo "IDENTIQUE à main"; break; fi
            echo "différent de main, nouvel essai dans 30 s"; sleep 30
          done
          [ "$a" = "$b" ] || { echo "::error::le site en ligne n'est pas à jour"; exit 1; }
          js=$(curl -sS "https://moodwall.pages.dev/$(grep -o 'js/main.js?v=[0-9a-f]*' <<<"$live")")
          grep -q 'playInPlace' <<<"$js" && echo "vidéo lue sur place : en ligne" || exit 1
          grep -q 'openViewer' <<<"$js" && { echo "::error::agrandissement encore en ligne"; exit 1; } || echo "agrandissement : retiré"
          grep -q 'id="keepSheet"' <<<"$live" && echo "feuille Keep : en ligne" || exit 1
          grep -q 'id="viewer"' <<<"$live" && exit 1 || echo "fenêtre d'agrandissement : absente"
