# Installation automatique de la partie serveur de Mood sur Supabase, puis tests de bout en bout.
#
#   - à chaque mise à jour de main qui touche supabase/ (et à la demande : bouton « Run workflow ») :
#       1. base de données (supabase/migrations) ; 2. fonctions (submit, report, moderate) ; 3. tests ;
#   - chaque lundi : tests seuls. Ça garde aussi le projet Supabase gratuit actif (il se met en
#     pause après 7 jours sans activité).
#
# Secrets GitHub nécessaires (Settings ▸ Secrets and variables ▸ Actions) :
#   SUPABASE_ACCESS_TOKEN   jeton personnel Supabase (Account ▸ Access Tokens)
#   SUPABASE_DB_PASSWORD    mot de passe de la base, choisi à la création du projet
name: Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/e2e.mjs', '.github/workflows/supabase.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
env:
  PROJECT_REF: ovvdtthnykqvgarrjina
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant (voir docs/INSTALLATION.md)"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant (voir docs/INSTALLATION.md)"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Base de données
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Fonctions serveur
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
  e2e:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de bout en bout (clé publique uniquement)
        run: node tests/e2e.mjs
      - name: Production dans un vrai navigateur (aucun appel en erreur, images du premier écran affichées)
        if: always()
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/prod.test.mjs
        env:
          PW_CHANNEL: chrome
