# Installation automatique de la partie serveur de Mood sur Supabase, puis tests de bout en bout.
#
#   - à chaque mise à jour de main qui touche supabase/ (et à la demande : bouton « Run workflow ») :
#       1. base de données (supabase/migrations) ; 2. fonctions (submit, report, moderate) ; 3. tests ;
#   - chaque lundi : tests seuls, plus le contrôle de la production dans un vrai navigateur (aussi à la
#     demande). Ça garde aussi le projet Supabase gratuit actif (il se met en pause après 7 jours sans activité) ;
#   - chaque nuit à 03:00 heure de Tokyo (et à la demande : « Run workflow » ▸ task = archive) : archive du mur
#     (tools/archive.mjs : captures iPhone et ordinateur + état en JSON, bucket PRIVÉ « archive »). Rien d'autre :
#     ni déploiement, ni tests.
#
# Secrets GitHub nécessaires (Settings ▸ Secrets and variables ▸ Actions) :
#   SUPABASE_ACCESS_TOKEN   jeton personnel Supabase (Account ▸ Access Tokens)
#   SUPABASE_DB_PASSWORD    mot de passe de la base, choisi à la création du projet
name: Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tests/e2e.mjs', '.github/workflows/supabase.yml']
  workflow_dispatch:
    inputs:
      task:
        description: 'deploy = base, fonctions et tests ; archive = archive du mur seulement'
        type: choice
        options: [deploy, archive]
        default: deploy
  schedule:
    - cron: '17 6 * * 1'     # lundi : tests
    - cron: '0 18 * * *'     # chaque nuit, 03:00 à Tokyo (18:00 UTC) : archive du mur
env:
  PROJECT_REF: ovvdtthnykqvgarrjina
jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task != 'archive')
    runs-on: ubuntu-24.04     # pas ubuntu-latest (26.04) : Playwright 1.56 ne s'y installe pas, voir checks.yml
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant (voir docs/INSTALLATION.md)"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Secret SUPABASE_DB_PASSWORD manquant (voir docs/INSTALLATION.md)"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          # Version figée : la 3.0.0 (2 nov. 2026) a changé « db push --password » (refusé sans --linked).
          # Pour monter de version : la tester d'abord sur une branche (Actions ▸ Supabase ▸ Run workflow).
          version: 2.122.1
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Base de données
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Fonctions serveur
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      # Alerte e-mail si une étape ci-dessus a échoué (Resend, tools/ci-alert.sh). Sans le secret RESEND_API_KEY :
      # ne fait rien et ne fait pas échouer le job. Destinataire : ADMIN_EMAIL de supabase/functions/_shared/http.js.
      - name: Alerte e-mail en cas d'échec
        if: failure()
        run: |
          if [ -f tools/ci-alert.sh ]; then bash tools/ci-alert.sh
          else echo "::warning::tools/ci-alert.sh introuvable (dépôt non récupéré), pas d'alerte"; fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  e2e:
    needs: deploy
    if: >-
      always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task != 'archive') || github.event.schedule == '17 6 * * 1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de bout en bout (clé publique uniquement)
        run: node tests/e2e.mjs
      # Contrôle de la production (Chrome + moteur de Safari) : seulement le lundi et à la demande, pas à chaque
      # déploiement (≈ 2 min de GitHub Actions, ≈ 20 Mo de bande passante Supabase par passage)
      - name: Production dans un vrai navigateur (aucun appel en erreur, images du premier écran affichées)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          node tests/prod.test.mjs
        env:
          PW_CHANNEL: chrome
      # Alerte e-mail si une étape ci-dessus a échoué (Resend, tools/ci-alert.sh). Sans le secret RESEND_API_KEY :
      # ne fait rien et ne fait pas échouer le job. Destinataire : ADMIN_EMAIL de supabase/functions/_shared/http.js.
      - name: Alerte e-mail en cas d'échec
        if: failure()
        run: |
          if [ -f tools/ci-alert.sh ]; then bash tools/ci-alert.sh
          else echo "::warning::tools/ci-alert.sh introuvable (dépôt non récupéré), pas d'alerte"; fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  archive:
    # une visite du site par vue (iPhone, ordinateur) et une lecture du mur public : rien n'est déposé ni modifié
    if: github.event.schedule == '0 18 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'archive')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1   # figée, comme le job deploy (voir plus haut)
      - name: Clé d'envoi (lue avec le jeton déjà présent, jamais écrite)
        run: |
          key=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key' | head -n 1)
          [ -n "$key" ] && [ "$key" != "null" ] || { echo "::error::clé service_role introuvable"; exit 1; }
          echo "::add-mask::$key"
          echo "SERVICE_KEY=$key" >> "$GITHUB_ENV"
      - name: Captures du mur et envoi dans le bucket privé « archive »
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/archive.mjs
        env:
          PW_CHANNEL: chrome
      # Alerte e-mail si une étape ci-dessus a échoué (Resend, tools/ci-alert.sh). Sans le secret RESEND_API_KEY :
      # ne fait rien et ne fait pas échouer le job. Destinataire : ADMIN_EMAIL de supabase/functions/_shared/http.js.
      - name: Alerte e-mail en cas d'échec
        if: failure()
        run: |
          if [ -f tools/ci-alert.sh ]; then bash tools/ci-alert.sh
          else echo "::warning::tools/ci-alert.sh introuvable (dépôt non récupéré), pas d'alerte"; fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
