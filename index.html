<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIKU — image, montage, direction artistique</title>
<meta name="description" content="Portfolio de Félix Cardonnel (RIKU) : image, montage et post-production entre le Japon et la France.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101010">

<!-- Polices auto-hébergées : le site ne dépend d'aucun serveur extérieur -->
<link rel="preload" href="assets/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">

<!-- Three.js 0.186.1 copié dans vendor/ (import map, sans étape de build) : le dossier fonctionne hors ligne. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<a class="skip" href="#index" data-i18n="skipToIndex">Aller à l'index</a>

<!-- Scène 3D (fixe) ; le défilement de la page pilote la caméra -->
<div id="stage" aria-hidden="true"></div>
<div id="dip" aria-hidden="true"></div>

<!-- Mode libre : croix de visée, invitation à entrer (capture de la souris), joystick tactile -->
<div id="cross" aria-hidden="true"></div>
<button type="button" id="lock" hidden>
  <span class="lock-title" data-i18n="lockTitle">Cliquer pour entrer</span>
  <span class="lock-how" data-i18n="lockHow"></span>
</button>
<div id="joy" hidden aria-hidden="true"><span class="knob"></span></div>
<button type="button" id="jumpBtn" hidden aria-label="Sauter">↑</button>

<!-- Piste de défilement : sa hauteur est calculée d'après la durée de la « séquence » -->
<main id="track" aria-label="Parcours"></main>

<!-- ============================ HUD ============================ -->
<header id="hud-top" class="hud" hidden>
  <div class="hud-id">
    <span class="brand">RIKU</span>
    <span class="hud-station" id="hudStation" aria-live="polite"></span>
  </div>
  <div class="tc" aria-label="Timecode" title="Timecode — position dans le parcours">
    <span class="tc-label">TC</span><output id="tc">00:00:00:00</output>
  </div>
  <nav class="hud-actions" aria-label="Actions">
    <div class="langs" role="group" aria-label="Langue / 言語 / Language">
      <button type="button" data-lang="fr">FR</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="btn" id="btnPause" aria-pressed="false" data-i18n="pause">Pause</button>
    <button type="button" class="btn" data-open="about" data-i18n="about">À propos</button>
    <button type="button" class="btn btn-strong" data-open="index" data-i18n="index">Index</button>
  </nav>
</header>

<section id="lower-third" class="hud" hidden aria-live="polite">
  <p class="lt-meta"></p>
  <h2 class="lt-title"></h2>
  <p class="lt-hint" data-i18n="aimHint"></p>
  <button type="button" class="btn lt-open" data-i18n="openSheet">Fiche</button>
</section>

<aside id="scopes" class="hud" hidden aria-hidden="true">
  <figure><canvas id="waveform" width="192" height="96"></canvas><figcaption>WFM Y′</figcaption></figure>
  <figure><canvas id="vectorscope" width="96" height="96"></canvas><figcaption>VEC 709</figcaption></figure>
</aside>

<nav id="strip" class="hud" hidden aria-label="Timeline du parcours">
  <div class="strip-track" id="stripTrack"></div>
  <div class="strip-head" id="stripHead" aria-hidden="true"></div>
</nav>

<!-- ============================ INDEX ============================ -->
<div id="index" class="panel" role="dialog" aria-modal="true" aria-labelledby="indexTitle" hidden>
  <div class="panel-head">
    <h2 id="indexTitle"><span data-i18n="index">Index</span> <small id="indexCount"></small></h2>
    <div class="panel-tools">
      <div class="langs" role="group" aria-label="Langue / 言語 / Language">
        <button type="button" data-lang="fr">FR</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="btn" data-open="about" data-i18n="about">À propos</button>
      <button type="button" class="btn" id="indexClose" data-close="index" data-i18n="enterSpace">Entrer dans l'espace</button>
    </div>
  </div>
  <div class="index-cols" aria-hidden="true">
    <span>TC IN</span><span></span><span data-i18n="colTitle">Titre</span><span data-i18n="colFormat">Format</span><span data-i18n="colDuration">Durée</span>
  </div>
  <ol id="indexList" class="index-list"></ol>
  <p class="index-foot" data-i18n="indexFoot"></p>
</div>

<!-- ============================ FICHE ============================ -->
<aside id="sheet" class="panel sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="panel-head">
    <p class="sheet-slug"></p>
    <button type="button" class="btn" data-close="sheet" data-i18n="close">Fermer</button>
  </div>
  <div class="sheet-content"></div>
</aside>

<!-- ============================ MIRE DE CHARGEMENT ============================ -->
<div id="bars" role="status" aria-live="polite">
  <div class="bars-top" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bars-mid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bars-low" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ident">
    <p class="ident-name">RIKU</p>
    <p class="ident-line" data-i18n="identLine"></p>
    <div class="ident-progress"><span id="barsProgress"></span></div>
    <p class="ident-status" id="barsStatus" data-i18n="loading"></p>
    <div class="ident-actions">
      <button type="button" class="btn btn-strong" id="enterBtn" data-i18n="enterSpace" hidden>Entrer dans l'espace</button>
      <button type="button" class="btn btn-strong" data-open="index" data-i18n="skipToIndex">Index</button>
    </div>
  </div>
</div>

<noscript>
  <div class="noscript">
    <p>RIKU — Félix Cardonnel. Ce portfolio nécessite JavaScript. / このサイトにはJavaScriptが必要です。 / This portfolio requires JavaScript.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
