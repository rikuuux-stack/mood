<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood</title>
<meta name="description" content="Mood — moodboard participatif.">
<meta name="theme-color" content="#0b0b0b">
<!-- connexion au serveur de données ouverte tout de suite, pendant le chargement du reste -->
<link rel="preconnect" href="https://ovvdtthnykqvgarrjina.supabase.co" crossorigin>
<link rel="preconnect" href="https://ovvdtthnykqvgarrjina.supabase.co">
<link rel="preload" href="assets/fonts/PlexSansJP-200-core.woff2?v=d70e044bc6" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=af3ebca491">
<link rel="stylesheet" href="css/site.css?v=ba5a13fde1">
</head>
<body>
<!-- Traitement des photos : noir et blanc + courbe de tons (hautes lumières assombries).
     Point d'entrée → sortie : 0 → 0 · 25 % → 24 % · 50 % → 47 % · 75 % → 64 % · 100 % → 76 %.
     Utilisé par css/site.css (.photo img). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="tone" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0 0.24 0.47 0.64 0.76"/>
      <feFuncG type="table" tableValues="0 0.24 0.47 0.64 0.76"/>
      <feFuncB type="table" tableValues="0 0.24 0.47 0.64 0.76"/>
    </feComponentTransfer>
  </filter>
</svg>
<a class="skip" href="#board" data-i18n="skip">Aller au contenu</a>

<header class="bar">
  <!-- nom du site, écrit à l'envers (retourné) ; ouvre le panneau « à propos » -->
  <button type="button" class="id" data-open="about" aria-haspopup="dialog" data-i18n-label="siteMenu"><span class="id-name">Mood</span></button>
  <!-- inclinaison (iPhone seulement, cachée ailleurs) : parallaxe ; l'autorisation n'est demandée qu'au toucher -->
  <button type="button" class="tilt" id="tiltBtn" hidden aria-pressed="false" data-i18n-label="tilt"><span aria-hidden="true"></span></button>
  <button type="button" class="btn-drop" data-open="drop" aria-haspopup="dialog" data-i18n="drop">Déposer</button>
</header>

<main id="board" tabindex="-1">
  <ul id="wall" class="wall"></ul>
  <ol id="list" class="list" hidden></ol>
  <p id="empty" class="empty" hidden data-i18n="empty"></p>
  <p class="more-wrap"><button type="button" id="more" class="link" hidden data-i18n="more"></button></p>
</main>


<!-- Agrandissement d'un dépôt -->
<dialog id="viewer" class="dlg dlg--viewer" aria-labelledby="viewerMeta">
  <div class="dlg-head">
    <p class="viewer-meta" id="viewerMeta"></p>
    <button type="button" class="x" data-close data-i18n-label="close">×</button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
  <details class="report" id="report">
    <summary data-i18n="report">Signaler</summary>
    <form class="report-form" id="reportForm">
      <fieldset>
        <legend class="sr" data-i18n="reportTitle"></legend>
        <label><input type="radio" name="reason" value="rights" required> <span data-i18n="rRights"></span></label>
        <label><input type="radio" name="reason" value="offensive"> <span data-i18n="rOffensive"></span></label>
        <label><input type="radio" name="reason" value="personal"> <span data-i18n="rPersonal"></span></label>
        <label><input type="radio" name="reason" value="spam"> <span data-i18n="rSpam"></span></label>
        <label><input type="radio" name="reason" value="other"> <span data-i18n="rOther"></span></label>
      </fieldset>
      <div class="captcha" data-captcha></div>
      <button type="submit" class="btn" data-i18n="reportSend"></button>
      <p class="form-msg" role="status"></p>
    </form>
  </details>
</dialog>

<!-- Dépôt : une image, des mots, ou les deux. Plus l'image a de pixels, moins il reste de mots (js/budget.js).
     Le visiteur choisit la taille d'affichage (S / M / L) et le grain de l'image (0 à 100, appliqué avant l'envoi). -->
<dialog id="drop" class="dlg dlg--drop" aria-labelledby="dropTitle">
  <form id="dropForm" class="drop-form" novalidate>
    <div class="dlg-head">
      <h2 id="dropTitle" data-i18n="drop"></h2>
      <button type="button" class="x" data-close data-i18n-label="close">×</button>
    </div>

    <div class="file-row">
      <label class="file">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
        <span class="btn" id="fileLabel" data-i18n="chooseImage"></span>
      </label>
      <button type="button" class="link" id="removeImage" hidden data-i18n="removeImage"></button>
    </div>
    <p class="hint" data-i18n="imageHint"></p>
    <figure class="preview" id="preview" hidden><span class="photo"><canvas aria-hidden="true"></canvas></span><figcaption id="previewInfo"></figcaption></figure>
    <label class="grain" id="grainRow" hidden><span data-i18n="grain"></span><input type="range" id="grain" min="0" max="100" step="1" value="0"><output id="grainOut" for="grain">0</output></label>

    <textarea id="text" rows="4" data-i18n-placeholder="textPlaceholder"></textarea>
    <p class="hint count" id="count" aria-live="polite"><span id="countN"></span></p>
    <fieldset class="sizes"><legend data-i18n="size"></legend>
      <label><input type="radio" name="size" value="s"><span>S</span></label>
      <label><input type="radio" name="size" value="m" checked><span>M</span></label>
      <label><input type="radio" name="size" value="l"><span>L</span></label>
    </fieldset>

    <input type="text" id="name" maxlength="40" autocomplete="nickname" data-i18n-placeholder="nameLabel">
    <label class="check"><input type="checkbox" id="rights"> <span data-i18n="rights"></span></label>
    <div class="captcha" data-captcha></div>
    <button type="submit" class="btn-drop btn-drop--wide" id="send" data-i18n="send"></button>
    <p class="form-msg" id="dropMsg" role="status" aria-live="polite"></p>
  </form>
</dialog>

<!-- À propos : contact, réglages (langue, affichage), mentions -->
<dialog id="about" class="dlg dlg--about" aria-labelledby="aboutTitle">
  <div class="dlg-head">
    <h2 id="aboutTitle">Mood</h2>
    <button type="button" class="x" data-close data-i18n-label="close">×</button>
  </div>
  <p><a class="mail" href="mailto:rikuuux@gmail.com">rikuuux@gmail.com</a></p>
  <div class="prefs">
    <span class="langs" role="group" aria-label="Langue / 言語 / Language">
      <button type="button" class="link" data-lang="fr" lang="fr">FR</button>
      <button type="button" class="link" data-lang="ja" lang="ja">日本語</button>
      <button type="button" class="link" data-lang="en" lang="en">EN</button>
    </span>
    <button type="button" class="link" id="viewBtn"></button>
  </div>
  <p class="hint"><span class="stamp stamp--inline" aria-hidden="true"></span> <span data-i18n="stampLegend"></span></p>
  <p class="hint" data-i18n="mentions"></p>
</dialog>

<script type="module" src="js/main.js?v=dae32e076a"></script>
</body>
</html>
